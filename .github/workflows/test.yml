name: Tests

# Standalone CI for pushes and pull requests, and reusable so the release workflow can
# require the tests as a precursor before it packs and publishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Linux, net10.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release --no-restore

  test-net-framework:
    name: Test (.NET Framework, Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # IncludeNetFrameworkTests adds net472 to the test project, so the suite runs against
      # the real .NET Framework runtime.
      - name: Restore
        run: dotnet restore -p:IncludeNetFrameworkTests=true

      - name: Test (net472)
        run: dotnet test -c Release --no-restore -f net472 -p:IncludeNetFrameworkTests=true
